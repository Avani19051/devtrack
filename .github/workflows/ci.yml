name: CI

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y tcl
          pip install -e ".[dev]"

      - name: Build C++ core + GoogleTest, run pytest (both backends)
        run: ./scripts/run_regression.sh

      - name: Tcl batch check-in smoke test
        run: |
          cd "$(mktemp -d)"
          devtrack init
          cp -r "$GITHUB_WORKSPACE/examples/artifacts" .
          tclsh "$GITHUB_WORKSPACE/scripts/devtrack_batch.tcl" artifacts "CI smoke" || true
          devtrack ls
          devtrack verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-py${{ matrix.python-version }}
          path: reports/
