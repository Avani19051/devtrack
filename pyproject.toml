[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devtrack"
version = "0.1.0"
description = "Version management, validation and regression testing for engineering artifacts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Avani Singh" }]
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
devtrack = "devtrack.cli:main"

[tool.setuptools]
packages = ["devtrack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
